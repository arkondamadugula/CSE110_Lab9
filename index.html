<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 9</title>

  <style>
    button {
      margin: 3px;
    }

    button:hover {
      cursor: pointer;
    }

    #first-num,
    #second-num {
      width: 60px;
    }

    output {
      border: 1px solid gray;
      display: block;
      height: 18px;
      margin-top: 5px;
      padding: 5px;
      width: 240px;
    }

    main {
      width: 800px;
    }

    #error-btns {
      column-gap: 5px;
      display: flex;
      flex-wrap: wrap;
      margin-top: 30px;
      row-gap: 5px;
    }

    #error-btns>* {
      padding: 8px 2px;
      width: 122px;
    }
  </style>
</head>

<body>
  <main>
    <form>
      <fieldset>
        <legend>Error Calculator</legend>
        <input name="first-num" id="first-num" />
        <select name="operator" id="operator">
          <option>+</option>
          <option>-</option>
          <option>*</option>
          <option>/</option>
        </select>
        <input name="second-num" id="second-num" />
        <button id="calculate">Calculate</button>
        <br />
        <output></output>
      </fieldset>
    </form>

    <section id="error-btns">
      <button>Console Log</button>
      <button>Console Error</button>
      <button>Console Count</button>
      <button>Console Warn</button>
      <button>Console Assert</button>
      <button>Console Clear</button>
      <button>Console Dir</button>
      <button>Console dirxml</button>
      <button>Console Group Start</button>
      <button>Console Group End</button>
      <button>Console Table</button>
      <button>Start Timer</button>
      <button>End Timer</button>
      <button>Console Trace</button>
      <button>Trigger a Global Error</button>
      <button>Throw Custom Error</button>
    </section>
  </main>

  <script>
    let form = document.querySelector('form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      let output = document.querySelector('output');
      let firstNum = document.querySelector('#first-num').value;
      let secondNum = document.querySelector('#second-num').value;
      let operator = document.querySelector('#operator').value;
      output.innerHTML = eval(`${firstNum} ${operator} ${secondNum}`);
    });

    let errorBtns = Array.from(document.querySelectorAll('#error-btns > button'));

    // Start your code here
    // You may move this JS to another file if you wish

    // Global error handler
window.addEventListener('error', event => {
  console.error('Global error caught!');
  console.error('Message:', event.message);
  console.error('File:', event.filename);
  console.error('Line:', event.lineno);
  console.error('Column:', event.colno);
  console.error('Error object:', event.error);
});

// Button 0: Console Log
errorBtns[0].addEventListener('click', () => {
  console.log('Hello from console.log!');
});

// Button 1: Console Error
errorBtns[1].addEventListener('click', () => {
  console.error('This is a console.error message.');
});

// Button 2: Console Count
errorBtns[2].addEventListener('click', () => {
  console.count('Console Count button clicked');
});

// Button 3: Console Warn
errorBtns[3].addEventListener('click', () => {
  console.warn('This is a console.warn message.');
});

// Button 4: Console Assert
errorBtns[4].addEventListener('click', () => {
  console.assert(false, 'This assertion failed on purpose.');
});

// Button 5: Console Clear
errorBtns[5].addEventListener('click', () => {
  console.clear();
});

// Button 6: Console Dir
errorBtns[6].addEventListener('click', () => {
  console.dir(document.querySelector('form'));
});

// Button 7: Console dirxml
errorBtns[7].addEventListener('click', () => {
  console.dirxml(document.querySelector('main'));
});

// Button 8: Console Group Start
errorBtns[8].addEventListener('click', () => {
  console.group('My Console Group');
  console.log('This message is inside the group.');
  console.log('Click Console Group End to close it.');
});

// Button 9: Console Group End
errorBtns[9].addEventListener('click', () => {
  console.groupEnd();
});

// Button 10: Console Table
errorBtns[10].addEventListener('click', () => {
  console.table([
    { method: 'console.log', purpose: 'general messages' },
    { method: 'console.error', purpose: 'error messages' },
    { method: 'console.table', purpose: 'table data' }
  ]);
});

// Button 11: Start Timer
errorBtns[11].addEventListener('click', () => {
  console.time('myTimer');
  console.log('Timer started.');
});

// Button 12: End Timer
errorBtns[12].addEventListener('click', () => {
  console.timeEnd('myTimer');
});

// Button 13: Console Trace
errorBtns[13].addEventListener('click', () => {
  console.trace('Console trace example');
});

// Button 14: Trigger a Global Error
errorBtns[14].addEventListener('click', () => {
  missingFunction();
});

// Try / Catch / Finally example using the calculator
form.addEventListener('submit', e => {
  try {
    let firstNum = document.querySelector('#first-num').value;
    let secondNum = document.querySelector('#second-num').value;

    if (firstNum === '' || secondNum === '') {
      throw new Error('Both number fields must be filled out.');
    }
  } catch (error) {
    console.error('Try/Catch caught an error:', error.message);
  } finally {
    console.log('Finally block ran after calculator submit.');
  }
});

// Custom error
class CalculatorError extends Error {
  constructor(message) {
    super(message);
    this.name = 'CalculatorError';
  }
}

errorBtns[15].addEventListener('click', () => {
  try {
    throw new CalculatorError('This is a custom calculator error.');
  } catch (error) {
    console.error(error.name + ': ' + error.message);
  }
});

  </script>
</body>

</html>
